<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Número do Dia</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #f1f5f9;
    font-family: system-ui, sans-serif;
    text-align: center;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 400;
    color: #94a3b8;
    margin-bottom: 0.5rem;
  }
  #numero {
    font-size: 6rem;
    font-weight: 700;
    color: #38bdf8;
    margin: 0;
  }
  #data {
    margin-top: 1rem;
    color: #64748b;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <h1>Número do Dia</h1>
  <p id="numero">--</p>
  <p id="data"></p>

  <script>
    // Mesma lógica do main.cpp: seed baseada na data (ano, mês, dia)
    function numeroDoDia() {
      const hoje = new Date();
      const seed = hoje.getFullYear() * 10000 + (hoje.getMonth() + 1) * 100 + hoje.getDate();

      // Gerador simples baseado na seed (equivalente ao rand() com srand())
      let x = Math.sin(seed) * 10000;
      let fracionario = x - Math.floor(x);
      let numero = Math.floor(fracionario * 100) + 1;

      document.getElementById("numero").textContent = numero;
      document.getElementById("data").textContent =
        hoje.getDate() + "/" + (hoje.getMonth() + 1) + "/" + hoje.getFullYear();
    }

    numeroDoDia();
  </script>
</body>
</html>
